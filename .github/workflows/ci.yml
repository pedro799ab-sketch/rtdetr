name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Python syntax check (compileall, own code only)
        run: |
          # Only lint our own code. src/ is the upstream RT-DETR codebase
          # (Apache-2.0) and is intentionally not modified here.
          python -m compileall -q tools *.py

      - name: Ruff (style + simple bugs, own code only)
        run: |
          ruff check tools *.py \
            --select=E9,F63,F7,F82 \
            --output-format=github

  smoke-import:
    name: Smoke import test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch for CI speed
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install PyYAML scipy pycocotools faster-coco-eval tensorboard onnx

      - name: Verify package can be imported
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import src; print('src package OK')"
